# living-ledger — per-repo config. Committed with the repo so the hooks are
# self-sufficient on any clone. Managed by /ledger-init; safe to hand-edit.
#
# ledger-template-version: 4

# Path to the ledger, relative to the repo root.
LEDGER_PATH=__LEDGER_PATH__

# Stable cross-repo id (origin-remote slug, or basename+hash). Do not change once
# the repo is registered in the cross-repo index.
REPO_ID=__REPO_ID__

# Sync floor: entries are derived from the trailers of commits AFTER this one. Fixed at
# install and committed, so every clone derives the same ledger. Moving it earlier re-derives
# older history (deduplicated by id); there is never a reason to move it later.
SYNC_FROM=__SYNC_FROM__

# Level-2 decisions record (the plain-language reasoning), relative to the repo root.
# Append-only: ledger-sync.sh appends the dated fact to its log; humans write the prose.
DECISIONS_PATH=__DECISIONS_PATH__

# Level 3, OPTIONAL. If this repo has an audience surface — a talk script, a paper, the
# README's claims — name it here. It is updated ON REQUEST only; nothing rewrites it
# automatically, and it never carries the history of our own corrections.
# AUDIENCE_SURFACE=presentations/talk_script.md

# Commits the gate should not ask for a trailer — a pipeline, a cron job. Regexes (Python syntax)
# on the subject / on "Name <email>". [bot] authors, merges and reverts are always exempt.
# EXEMPT_SUBJECTS="^chore: nightly data refresh$"
# EXEMPT_AUTHORS="^Deploy Bot "

# Set to `no` to have session start only REPORT that this clone's ledger git hooks are off,
# instead of activating them.
# AUTO_HOOKS=no
